# Partition Manager layout for Augmental Vox/Dotto with MCUboot single-slot +
# USB-CDC serial recovery. The MCUboot bootloader gets 64KB (the default 48KB is
# too small once the USB device stack for serial recovery is included). One app
# slot (~928KB) — single-bank, so an update overwrites only the app. BLE bonds
# live in settings_storage, anchored at the flash end and outside both the
# bootloader and the app slot, so updates never touch them.

mcuboot:
  address: 0x0
  end_address: 0x10000
  region: flash_primary
  size: 0x10000
mcuboot_pad:
  address: 0x10000
  end_address: 0x10200
  region: flash_primary
  size: 0x200
mcuboot_primary:
  address: 0x10000
  end_address: 0xf8000
  orig_span: &id001
  - mcuboot_pad
  - app
  region: flash_primary
  size: 0xe8000
  span: *id001
mcuboot_primary_app:
  address: 0x10200
  end_address: 0xf8000
  orig_span: &id002
  - app
  region: flash_primary
  size: 0xe7e00
  span: *id002
app:
  address: 0x10200
  end_address: 0xf8000
  region: flash_primary
  size: 0xe7e00
settings_storage:
  address: 0xf8000
  end_address: 0x100000
  region: flash_primary
  size: 0x8000
sram_primary:
  address: 0x20000000
  end_address: 0x20040000
  region: sram_primary
  size: 0x40000
