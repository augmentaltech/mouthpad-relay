# SFP-667 (a): build a .uf2 for the Adafruit nRF52 UF2 bootloader.
# Family ID defaults to 0xada52840 (SOC_NRF52840_QIAA), which the bootloader
# expects, so no explicit family-id needed. App links at the code-partition
# (0x26000) from uf2.overlay.
# Link the app at the code-partition (0x26000) from uf2.overlay — without this
# the app links at 0x0 and the .uf2 base is wrong for the bootloader.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y
