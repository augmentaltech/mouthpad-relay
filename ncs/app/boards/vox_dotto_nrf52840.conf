# Augmental Vox (Dotto) config.
# Display (SSD1306 OLED) isn't present on Dotto.
CONFIG_DISPLAY=n
CONFIG_SSD1306=n

# MCUboot is REQUIRED for this board (pm_static_vox_dotto_nrf52840.yml lays out the
# mcuboot + single app slot + settings_storage partitions). Build with:
#   -DSB_CONFIG_BOOTLOADER_MCUBOOT=y -DSB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
# sysbuild then sets CONFIG_BOOTLOADER_MCUBOOT=y on this app image automatically.
# DFU: single-slot, USB-CDC serial recovery (see sysbuild/mcuboot.conf +
# sysbuild/mcuboot.overlay) — hold the user button at boot to enter recovery, then
# upload with mcumgr / nRF Connect Device Manager. Bonds (settings_storage) are
# preserved across updates.

# Persistent BLE bonds via NVS in the storage partition.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# I2C for the KTD2026 RGB LED driver.
CONFIG_I2C=y

# RTT console/logging for the bench (Dotto SWD via J-Link).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
