# Augmental Vox (Dotto) bring-up config — J-Link flashed flat, no MCUboot.
# Display (SSD1306 OLED) isn't present on Dotto.
CONFIG_DISPLAY=n
CONFIG_SSD1306=n

# No MCUboot — flat app at 0x0, programmed via J-Link.
CONFIG_BOOTLOADER_MCUBOOT=n

# Persistent BLE bonds via NVS in the storage partition.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# I2C for the KTD2026 RGB LED driver.
CONFIG_I2C=y

# RTT console/logging for the bench (Dotto SWD via J-Link).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
