# nRF52840 DK (PCA10056) bring-up config — J-Link flashed, no UF2/MCUboot.
# Display (SSD1306 OLED) isn't present on the bare DK.
CONFIG_DISPLAY=n
CONFIG_SSD1306=n

# No MCUboot — flat app at 0x0, programmed via J-Link.
CONFIG_BOOTLOADER_MCUBOOT=n

# Persistent BLE bonds via NVS in the board's storage partition.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# RTT console/logging for the bench (DK has J-Link RTT).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
