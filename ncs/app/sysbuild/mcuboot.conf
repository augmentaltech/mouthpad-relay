# MCUboot image config for the Vox/Dotto build: single-slot, USB-CDC serial
# recovery. Entered by holding the user button (mcuboot-button0) at boot; MCUboot
# then exposes a USB CDC port and writes the uploaded image directly to the single
# app slot (mcumgr / nRF Connect Device Manager). Updates overwrite only the app
# slot — the settings_storage partition (BLE bonds) is separate and untouched.
#
# Applied to the mcuboot image by sysbuild when SB_CONFIG_BOOTLOADER_MCUBOOT=y.

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
# GPIO entrance: hold mcuboot-button0 at boot to enter recovery. On the bare DK
# this is overridden to DK button1 (P0.11, active-low + pull-up) in
# sysbuild/mcuboot.overlay, because the Dotto button pin (P0.31 = AIN7) floats on
# the DK and false-triggers recovery. On real Dotto, mcuboot-button0 is the real
# P0.31 button (board DTS) — drop the DK override there.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y

# USB device for the recovery CDC port.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="MouthPad^USB DFU"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F

# Lean bootloader.
CONFIG_LOG=n
CONFIG_CONSOLE=n
